[workspace]
resolver = "2"
members = ["crates/cercis-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
cercis-core = { path = "../../kernel/crates/cercis-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
